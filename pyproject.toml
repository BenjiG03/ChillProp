[project]
name = "chillprop"
version = "0.0.1"
description = "A JAX-based mirror of CoolProp (Under Construction)"
readme = "README.md"
authors = [{name = "Benji", email = "benji@example.com"}]
dependencies = [
    "jax",
    "jaxlib",
    "equinox",
    "CoolProp",
    "pytest",
    "numpy",
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["chillprop*"]
exclude = ["CoolProp*", "validation_plots*", "scripts*", "tests*"]
